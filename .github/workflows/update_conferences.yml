name: Weekly Conference Update

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday 9:00 AM UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-conferences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install requests pyyaml beautifulsoup4

      - name: Run conference tracker
        run: python update_conferences.py

      - name: Commit and push if changed
        run: |
          git config user.name "conference-bot"
          git config user.email "conference-bot@users.noreply.github.com"
          git add conferences/data.json
          git diff --staged --quiet || (
            git commit -m "chore: update conference data $(date -u +%Y-%m-%d)" &&
            git push
          )
